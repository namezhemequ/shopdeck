# HTTP → HTTPS redirect
server {
    listen       80;
    server_name  shopdeck.tech www.shopdeck.tech;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen       443 ssl;
    server_name  shopdeck.tech www.shopdeck.tech;

    ssl_certificate     /etc/nginx/certs/www.shopdeck.tech.pem;
    ssl_certificate_key /etc/nginx/certs/www.shopdeck.tech.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip            on;
    gzip_min_length 1k;
    gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary       on;

    # ============================================================
    # Static files (SPA uses hash mode, no server-side route fallback needed)
    # ============================================================
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # ============================================================
    # Proxy all API requests to Spring Boot backend
    # ============================================================
    location ~ ^/(admin|product|order|brand|subject|coupon|flash|menu|role|resource|sku|memberLevel|home|prefrenceArea|returnApply|returnReason|companyAddress|orderSetting|productAttribute|productCategory|flashProductRelation|flashSession|couponHistory|resourceCategory|minio|aliyun)/ {
        proxy_pass http://admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Proxy actuator endpoints
    location /actuator {
        proxy_pass http://admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Grafana — 监控仪表盘
    # ============================================================
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket for live dashboard updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================================
    # Prometheus — 指标查询
    # ============================================================
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Jenkins — CI/CD
    # ============================================================
    location /jenkins/ {
        proxy_pass http://jenkins:8080/jenkins/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jenkins needs these
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 150;
        proxy_send_timeout 100;
        proxy_read_timeout 100;
        proxy_buffer_size 8k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;
    }
}
