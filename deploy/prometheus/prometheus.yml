global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 容器指标（CPU / 内存 / 网络 / 磁盘 IO）
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 宿主机指标（CPU / 内存 / 磁盘 / 网络）
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
